command:
  - uvicorn
  - app:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

# ============================================================================
# Estate Command Center — the ONE file you configure.
# ============================================================================
# This is the only configuration file. Edit the `value:` on the lines below,
# then deploy. There is nothing else to fill in.
#
# HOW TO EDIT: every entry is a `- name: … / value: …` pair. Change ONLY the
# text inside the quotes on a `value:` line. Don't touch the `- name:` keys,
# the `- `, or the indentation. Keep every value quoted. (If the app won't
# start after an edit, run `git checkout app.yaml` to reset and try again.)
#
# ── The 30-second version ───────────────────────────────────────────────────
#   • This ships in LIVE mode. Set the 2 values under "LIVE MODE" below
#     (warehouse + gold schema) and deploy → it reads your real estate.
#   • Haven't set them yet? The app still boots — it shows DEMO data with a
#     "finish setup to go live" banner until you fill them in. (To stay in demo
#     on purpose, set USE_LIVE to "false".)
#   • Everything else has a safe default and can be LEFT BLANK — each value
#     says exactly what happens if you leave it blank.
# ============================================================================

env:

  # ── Cosmetic ───────────────────────────────────────────────────────────────
  # The name shown in the app header. Any text. (Purely a label.)
  - name: FINOPS_CUSTOMER_NAME
    value: "Acme Corp"

  # ════════════════════════════════════════════════════════════════════════
  # LIVE MODE — ships ON. Set the warehouse + gold schema below to read your
  # real estate. Until they're set, the app boots in DEMO with a setup banner.
  # (Set USE_LIVE to "false" to stay in demo deliberately.)
  # ════════════════════════════════════════════════════════════════════════

  # "true"  = read your real system tables (system.billing, query.history, …).
  # "false" = DEMO mode with realistic synthetic data (no warehouse, no grants).
  - name: USE_LIVE
    value: "true"

  # The SQL warehouse the app queries with (a serverless SQL warehouse in THIS
  # workspace). REQUIRED when USE_LIVE="true". Leave blank in demo mode.
  # → Grant the app's service principal CAN USE on it (see the deployment guide).
  - name: DATABRICKS_WAREHOUSE_ID
    value: ""

  # Schema (catalog.schema, e.g. "main.finops_gold") the nightly finops_gold_sync
  # job precomputes into — the app reads it in ~1s instead of scanning account-wide
  # system tables on every page. REQUIRED when USE_LIVE="true"; ignored in demo.
  # The job CREATES the schema + its tables for you — you only need CREATE on the
  # catalog. (This same schema also stores acknowledge/dismiss state by default —
  # see WRITEBACK below.)
  - name: FINOPS_GOLD_SCHEMA
    value: ""

  # ── Feature toggles (all optional; sensible defaults) ───────────────────────
  # Set any to "false" to hide that surface (its API also goes inert — no half-
  # rendered tabs, no model calls). Leave "true" to keep it on.
  #
  # Ask Genie banner (natural-language Q&A over your cost tables).
  - name: FINOPS_FEATURE_GENIE
    value: "true"
  # LLM-written rationale on recommendations (calls the Claude endpoint below).
  # If "false", recommendations still appear with clear rule-based explanations —
  # just no LLM phrasing. No model is ever called when off.
  - name: FINOPS_FEATURE_AI_NARRATION
    value: "true"
  # Data Quality tab (reads system.data_quality_monitoring.table_results — grant SELECT
  # on that TABLE; a schema-level grant fails with "does not have MANAGE on Schema").
  - name: FINOPS_FEATURE_DQM
    value: "true"
  # (Acknowledge / dismiss on alerts is BUILT IN — it always ships with the app,
  # there's no flag to turn it off. Where its state is stored is set by the deploy
  # target, not here — see WRITEBACK STORAGE below.)

  # ════════════════════════════════════════════════════════════════════════
  # WRITEBACK STORAGE — where the (always-on) acknowledge/dismiss state is saved.
  #
  #   Acknowledge/dismiss is built in. The ONLY choice is the storage backend, and
  #   it's set by the DEPLOY TARGET (a bundle can't create-or-skip the Postgres
  #   instance from a value here):
  #     • `databricks bundle deploy -t customer`        → LAKEBASE (recommended)
  #         The bundle creates + wires a managed Postgres instance for you.
  #         Snappy at any scale; nothing to set below.
  #     • `databricks bundle deploy -t customer-delta`  → DELTA (the only opt-out)
  #         No Postgres instance — state goes in one tiny Delta table in the schema
  #         below. No extra infra/cost, BUT the app's service principal needs write
  #         (CREATE/MODIFY) on that schema (see the deployment guide, Step ④).
  #
  #   Use the default (`-t customer`, Lakebase) unless you specifically don't want
  #   a managed-Postgres instance. Demo mode ignores all of this (state in-memory).
  # ════════════════════════════════════════════════════════════════════════

  # DELTA fallback only (`-t customer-delta`): schema for the ack/dismiss table.
  # LEAVE BLANK to reuse FINOPS_GOLD_SCHEMA (the usual choice — nothing to set).
  # Set a separate schema only if you want the state kept apart from gold.
  # Ignored on the Lakebase (default) target.
  - name: FINOPS_WRITEBACK_SCHEMA
    value: ""

  # LAKEBASE default only (`-t customer`): the Postgres schema the app owns for
  # its state. LEAVE BLANK ⇒ "finops". Set a UNIQUE name (e.g. your company) if
  # you ever DELETE + recreate the app — the new app gets a new identity that
  # can't reuse the old one's schema, so a fresh name avoids a "permission denied"
  # on acks. Ignored on the Delta fallback target.
  - name: FINOPS_LAKEBASE_SCHEMA
    value: ""

  # ── AI endpoint (only used when FINOPS_FEATURE_AI_NARRATION / Genie are on) ──
  # The Claude serving endpoint for recommendation narration. The default is a
  # standard workspace endpoint. Point at an in-region model if your account has
  # data-residency requirements. Blank ⇒ deterministic rule text (no model call).
  - name: FINOPS_LLM_ENDPOINT
    value: "databricks-claude-sonnet-4-6"

  # Genie Space id for Ask Genie. LEAVE BLANK ⇒ the app auto-creates one over your
  # cost/usage tables on first run (nothing to set). Set an id only to pin a
  # specific, pre-curated Space.
  - name: GENIE_SPACE_ID
    value: ""

  # ── Currency ────────────────────────────────────────────────────────────────
  # Adds an AUD toggle: AUD = USD list price × this rate (indicative only).
  # Leave as-is if you don't need it.
  - name: FINOPS_FX_AUD
    value: "1.52"

  # ════════════════════════════════════════════════════════════════════════
  # OPTIONAL EXTRAS — every one of these can be LEFT BLANK.
  # ════════════════════════════════════════════════════════════════════════

  # ── Effective cost ─────────────────────────────────────────────────
  # The app's figures are LIST price. Set your blended committed-use / reservation
  # discount as a fraction (e.g. "0.30" = 30% off) and every $ also shows effective
  # cost (list × (1 − discount)) with the assumptions stated. BLANK/"0" ⇒ list only
  # (the app never invents an effective number). Azure VM/infra cost is NOT here —
  # that's an Azure Cost Management reconciliation, surfaced as an explicit caveat.
  - name: FINOPS_EFFECTIVE_DISCOUNT
    value: ""

  # ── Workspace grouping by naming convention ───────────────────────────
  # Ordered "PREFIX:Label" rules, ";"-separated; first matching prefix wins
  # (case-insensitive). BLANK ⇒ grouping is off (the group lens/filter is hidden). e.g.
  # "DATA-EDP-:EDP Core;DATA-ANA-:EDP Edge;FORE-:Forecasting". Unmatched ⇒ "Other".
  - name: FINOPS_WORKSPACE_GROUPS
    value: ""

  # ── Environment tiers from workspace names ──────────────────────────────────
  # Ordered "Tier:token|token" rules, ";"-separated. Names are split into tokens on
  # any non-letter/digit (DATA-EDP-TST → data, edp, tst); first matching tier wins.
  # BLANK ⇒ built-in tiers: Dev (dev, develop, development, dv), Test (tst, test,
  # testing, qa, uat, sit, fat, sat), Pre-prod (ppd, preprod, stg, stage, staging, perf,
  # prf), Sandbox (sbx, sandbox, lab, poc, playground), Non-prod (nonprod, nonprd, npd),
  # Prod (prd, prod, production, live). Numbered variants (de2, ts2) also match.
  # Dev/Test/Pre-prod/Sandbox/Non-prod count as Non-production.
  - name: FINOPS_ENV_TIERS
    value: ""

  # Filler words dropped from the automatic platform name (technology / region
  # suffixes every workspace shares). BLANK ⇒ adb,dbw,databricks,aue,ase,aueast,ausoutheast,ause.
  # Set to "-" to keep every word.
  - name: FINOPS_PLATFORM_STRIP_WORDS
    value: ""

  # ── Extra Non-production rule ───────────────────────────────────────────────
  # Optional regex (case-insensitive); a matching name is ALSO Non-production,
  # for conventions the token tiers above can't express. BLANK ⇒ tiers only.
  - name: FINOPS_ENV_NONPROD_PATTERN
    value: ""

  # ── Workload classification overrides ──────────────────────────────
  # Optional "regex:Bucket" rules (";"-separated) checked BEFORE the built-ins, to
  # steer job/pipeline names into Batch / Streaming / Interactive / Ad-hoc / ML / AI.
  # BLANK ⇒ built-in keyword rules only.
  - name: FINOPS_WORKLOAD_RULES
    value: ""

  # Business-unit reporting: a table you maintain mapping workspace_id → business
  # unit (+ optional owner), e.g. "main.finops_ref.workspace_bu". BLANK ⇒ the app
  # simply hides all BU columns/filters (no fake data). See
  # reference/mapping_tables_setup.sql for the table shape.
  - name: FINOPS_WORKSPACE_BU_TABLE
    value: ""
  # Team reporting on the Adoption tab: a table mapping user → team, e.g.
  # "main.finops_ref.user_team". BLANK ⇒ the app hides the team column. Same
  # reference SQL as above.
  - name: FINOPS_USER_TEAM_TABLE
    value: ""

  # Admin-data schema for the finops_admin_sync job (budgets, policies, tokens,
  # groups — data that isn't in the plain system tables). BLANK ⇒ those specific
  # governance/access panels show a "run the admin-sync job" note; everything else
  # works. Set it (+ unpause finops_admin_sync) to fill those panels.
  - name: FINOPS_INGEST_SCHEMA
    value: ""

  # ── Advanced (you almost certainly leave these blank) ───────────────────────
  # Bump this string to force-drop all cached payloads at once (e.g. after
  # changing a mapping table). Old entries also age out on their own.
  - name: FINOPS_CACHE_VERSION
    value: "2"
  # Only for a UI-only "Create app" deploy WITHOUT the bundle: the workspace path
  # holding the code, so the app can self-create its jobs. BLANK for the normal
  # `bundle deploy` path (the bundle already creates the jobs — setting this then
  # would make DUPLICATES).
  - name: FINOPS_SOURCE_PATH
    value: ""
  # Optional service principal to run the auto-created jobs as (UI-only path).
  - name: FINOPS_JOB_RUN_AS
    value: ""
