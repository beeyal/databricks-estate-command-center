# ===========================================================================
# FinOps Command Center — per-customer configuration (SPEC §14, GridSense-style)
# ===========================================================================
# ONBOARDING A CUSTOMER = EDIT THIS FILE ONLY. No code changes, ever.
#
# `deploy.sh` reads this file and writes the matching env vars into app.yaml so
# the deployed App picks them up. The mapping is:
#
#   customer_name   -> FINOPS_CUSTOMER_NAME        (label shown in the UI)
#   warehouse_id    -> DATABRICKS_WAREHOUSE_ID      (live system-table reads)
#   genie_space_id  -> GENIE_SPACE_ID               (Ask Genie banner, AU-only)
#   fx_aud          -> FINOPS_FX_AUD                 (dual-currency AUD = USD × fx)
#   use_live        -> USE_LIVE                      (demo ⇄ live switch)
#   llm_endpoint    -> FINOPS_LLM_ENDPOINT           (Claude for narration)
#   features.genie        -> FINOPS_FEATURE_GENIE
#   features.ai_narration -> FINOPS_FEATURE_AI_NARRATION
#   features.dqm          -> FINOPS_FEATURE_DQM
#   catalog_scope   -> written into config.yaml (list; no single env var)
#
# PRECEDENCE (highest first), enforced by data/config.py:
#   1. Environment variable in app.yaml   (what deploy.sh writes from here)
#   2. config.yaml
#   3. Built-in default
#
# The declarative feature flags below are the alternative to the deploy.sh
# `--no-ai` / `--no-dqm` switches — those switches still work and OVERRIDE these
# values for that one run. Set flags here to make a customer's choice permanent
# and self-documenting.
# ---------------------------------------------------------------------------

# Display name shown in the app header / API. Cosmetic only.
customer_name: "Acme Corp"

# ---------------------------------------------------------------------------
# Data mode — demo ⇄ live (SPEC §14).
#   false : ships seeded demo data. No warehouse, no grants. Safe first deploy.
#   true  : reads live system tables via the warehouse below. Requires the
#           read-only SELECT grants in docs/DEPLOYMENT.md.
# ---------------------------------------------------------------------------
use_live: false

# SQL Warehouse ID for live mode (USE_LIVE=true). Blank ⇒ demo. Small / Serverless
# is plenty — the app only issues read-only system-table SELECTs.
warehouse_id: ""

# ---------------------------------------------------------------------------
# Feature flags — the four deploy variants (SPEC §10):
#   AI + DQM  : genie=true,  ai_narration=true,  dqm=true
#   AI only   : genie=true,  ai_narration=true,  dqm=false
#   DQM only  : genie=false, ai_narration=false, dqm=true
#   neither   : genie=false, ai_narration=false, dqm=false
#
# The deterministic recommender, cost-attribution, and Genie-cost attribution
# are ALWAYS on regardless of these flags — they call no model.
# ---------------------------------------------------------------------------
features:
  # Ask Genie banner + /api/genie/ask SSE (Genie Conversation API).
  # Requires genie_space_id below when use_live=true.
  genie: true
  # LLM rationale on recommendations (FMAPI Claude call).
  # On by default; deploy with --no-ai (or set false) to ship a no-model build.
  ai_narration: true
  # Data Quality Monitoring tab + /api/dqm (Lakehouse Monitoring).
  dqm: true

# ---------------------------------------------------------------------------
# Genie Space curated over the customer's cost/usage/access tables. Blank ⇒ demo
# mode returns canned streamed answers. Only used when features.genie=true.
# ---------------------------------------------------------------------------
genie_space_id: ""

# FMAPI Claude serving endpoint for ai_narration. Only used when
# features.ai_narration=true.
llm_endpoint: databricks-claude-sonnet-4-6

# ---------------------------------------------------------------------------
# Catalog / workspace scope for the Access & Tables pages. Empty list = all
# non-system catalogs the app SP can see. Restrict to the customer's own
# catalogs to keep the footprint tight and the view relevant.
# (Written into config.yaml `catalog_scope` — it is a list, not a single env var.)
# ---------------------------------------------------------------------------
# Gold-table schema — REQUIRED for live mode (the app's serving layer). When set +
# the nightly finops_gold_sync job is unpaused, that job precomputes every estate
# payload AND a per-table size census into <schema>.finops_gold and
# <schema>.finops_gold_table_sizes, and the app reads them in ~1s (on a small
# serverless warehouse that scales to zero). The app's reads are over account-wide
# system tables (tens of millions of rows), so live-per-request isn't production-
# viable — the app refuses to boot in live mode unless this is set. Ignored in demo.
# The job SP needs read on the system tables + CREATE/MODIFY on this schema (or
# CREATE on the catalog, and the job creates the schema). Read-only-eval escape
# hatch (slow, not for prod): set env FINOPS_ALLOW_LIVE_NO_GOLD=true.
# gold_schema: "main.finops_gold"
gold_schema: ""

# Optional dedicated schema for the writeback (acknowledge/ignore) finops_ack_status
# Delta table in live mode. Blank ⇒ falls back to gold_schema (recommended — no
# extra schema to manage). Not used on the customer-lakebase target (self-provisions
# its own Postgres schema). The app SP needs CREATE + MODIFY on whichever schema is used.
# writeback_schema: "main.finops_writeback"
writeback_schema: ""

# Legacy roll-up cache schema (superseded by gold_schema above; kept for back-
# compat). Blank ⇒ unused.
# rollup_schema: "main.finops_cc"
rollup_schema: ""

# Ingest schema for admin-API data (budgets, policies, tokens, SCIM groups, DQM
# monitors) pulled by the daily finops_admin_sync job into <schema>.finops_admin.
# When set + the job is scheduled, the governance budget/policy/PAT/alert tiles
# and the Access groups + PAT panels show REAL data with a "last refreshed" time.
# Blank ⇒ those admin-API panels show a "run finops_admin_sync" prompt.
# ingest_schema: "main.finops_cc"
ingest_schema: ""

# UI-only (no-CLI) deploys: set source_path to the WORKSPACE folder holding this
# code (e.g. your Git folder path). On startup the app then self-provisions the
# two daily jobs via the Jobs API — no need to create them by hand in Workflows.
# Leave BLANK for CLI/bundle deploys (the Asset Bundle creates the jobs). The app
# SP needs job-management rights; job_run_as optionally runs them as an admin SP.
# source_path: "/Workspace/Users/you@corp.com/finops-command-center"
source_path: ""
job_run_as: ""

# ---------------------------------------------------------------------------
# Org-mapping tables (OPTIONAL). Databricks system tables don't know your org
# structure, so these two small tables — which YOU own and maintain — let the
# app show business unit and team. Blank ⇒ the app simply hides those features
# (no empty "—"). Setup is a 2-minute copy-paste:
#
#   1. Run  reference/mapping_tables_setup.sql  (creates both tables + a GRANT;
#      edit the sample rows to your real workspaces/users).
#   2. Point the app at them, then redeploy. The BU + team features light up.
#
#   workspace_bu_table → Workspaces BU facet + per-BU cost attribution
#       columns: workspace_id STRING, bu STRING, owner STRING (optional)
#   user_team_table    → Adoption tab Team column + "Activity by team" rollup
#       columns: user STRING (matches query.history.executed_by), team STRING
#
# NOTE: the keys below only take effect on the `./deploy.sh` path (deploy.sh
# writes them into app.yaml). If you deploy the BUNDLE directly
# (`databricks bundle deploy`), set them in app.yaml instead, as env:
#       FINOPS_WORKSPACE_BU_TABLE / FINOPS_USER_TEAM_TABLE
# (env always wins over this file).
#
# workspace_bu_table: "main.finops_ref.workspace_bu"
workspace_bu_table: ""
# user_team_table: "main.finops_ref.user_team"
user_team_table: ""

catalog_scope: []
#   - main
#   - prod_analytics

# ---------------------------------------------------------------------------
# Dual-currency FX (SPEC §9): AUD = USD list price × fx_aud. Indicative only —
# USD list price remains the source of truth; the Account Console is authoritative
# for actual drawdown.
# ---------------------------------------------------------------------------
fx_aud: 1.52
