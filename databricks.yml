# ===========================================================================
# Estate Command Center — Databricks Asset Bundle (SPEC §14)
# ===========================================================================
# One-command deploy of the App into ANY workspace:
#
#     databricks bundle deploy -t dev          # your own workspace (default)
#     databricks bundle deploy -t customer     # a customer's workspace
#
# Onboarding a customer is CONFIG-ONLY — edit `app.yaml` (the single config file;
# never code) and `bundle deploy`. The App is a small always-on container (stop
# it to pay nothing) and ships in demo mode, so no warehouse or system-table
# grants are required just to stand it up. See docs/CUSTOMER_DEPLOYMENT.md.
# ---------------------------------------------------------------------------

bundle:
  name: estate-command-center

# ---------------------------------------------------------------------------
# Variables — overridable per target or with `--var key=value` at deploy time.
# The customer-facing runtime config lives in app.yaml (env); these are just
# bundle-level knobs. Leaving the defaults ships a fully-working demo.
# ---------------------------------------------------------------------------
variables:
  app_name:
    description: Databricks App name (must be unique in the target workspace).
    default: estate-command-center
  warehouse_id:
    description: >-
      SQL Warehouse ID for live system-table reads (USE_LIVE=true). Leave 'auto'
      for demo mode — no warehouse or grants required to run.
    default: auto
  ingest_schema:
    description: >-
      UC schema (catalog.schema) the finops_admin_sync job writes admin-API data
      into (finops_admin table). Also used as the roll-up cache schema.
    default: ""
  llm_model:
    description: >-
      Claude model for optional LLM narration (FMAPI serving endpoint).
    default: databricks-claude-sonnet-4-6

# Deploy under the current user's workspace files by default.
workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}

# Only sync what the app needs at runtime — the built React bundle + Python. The
# raw frontend/src is excluded via .databricksignore to keep the footprint tiny.
sync:
  include:
    - frontend/dist/**
  # Keep the deployed app lean — nothing below is needed at runtime, so it never
  # lands in the customer's workspace (docs, screenshots, spec). The app runs on
  # app.py + data/ + reference/ + app.yaml + frontend/dist + requirements.txt.
  exclude:
    - .claude
    - docs
    - "*.md"
    - .gitignore
    - .databricksignore

# ---------------------------------------------------------------------------
# Resources — the App itself. Runtime config (feature flags, USE_LIVE,
# GENIE_SPACE_ID, FX) lives in app.yaml `env` — the single config file. This
# keeps the bundle minimal and the same App definition portable across customers.
# ---------------------------------------------------------------------------
resources:
  apps:
    estate:
      name: ${var.app_name}
      description: >-
        Estate Command Center — Databricks-native cost, governance & data-quality console.
        Consolidates access, workspace analysis, AI query advisor, storage/table
        optimization, and cost governance into one app.
      source_code_path: ${workspace.root_path}/files

      # Live mode (USE_LIVE=true) reads system tables through a SQL warehouse.
      # Uncomment and set `warehouse_id` (or `--var warehouse_id=<id>`) to bind a
      # warehouse to the app's service principal. Demo mode needs neither this
      # resource nor any grant. The read-only grant list is in docs/DEPLOYMENT.md.
      #
      # resources:
      #   - name: sql-warehouse
      #     sql_warehouse:
      #       id: ${var.warehouse_id}
      #       permission: CAN_USE

  # TWO scheduled jobs (both nightly, both PAUSED until configured):
  #  1. finops_gold_sync — the FAST/CHEAP serving layer, and REQUIRED for live
  #     mode. Precomputes EVERY estate payload (overview, workspaces, tables,
  #     queries, adoption, classification, dqm, genie/ai cost, access grants,
  #     JOBS, RECOMMENDATIONS, GOVERNANCE) + a per-table SIZE census into Delta
  #     gold tables (<gold_schema>.finops_gold + .finops_gold_table_sizes); the app
  #     then reads those instantly (sub-second, small serverless warehouse,
  #     scale-to-zero). The app's system-table reads are ACCOUNT-WIDE (every
  #     workspace, tens of millions of rows), so running them live per request is
  #     not production-viable — the app refuses to boot in live mode unless
  #     `gold_schema` is set. There is NO GA system table for bulk table size (R3
  #     research), so the size census iterates information_schema.tables →
  #     DESCRIBE DETAIL. Set `gold_schema` in customise.yaml and UNPAUSE this job.
  #  2. finops_admin_sync — budgets/tokens/SCIM aren't in system tables and need
  #     a periodic pull with account-admin creds. Writes a Delta admin store.
  jobs:
    finops_gold_sync:
      name: ${var.app_name}-gold-sync
      schedule:
        quartz_cron_expression: "0 30 1 * * ?"   # 01:30 daily (before admin-sync)
        timezone_id: "UTC"
        pause_status: PAUSED                     # REQUIRED for live: set gold_schema + UNPAUSE (app won't boot live without it)
      tasks:
        - task_key: gold_sync
          spark_python_task:
            # Reads the same app.yaml the app uses (synced alongside), so
            # warehouse + gold_schema config is shared — nothing to keep in sync.
            python_file: ${workspace.root_path}/files/data/gold.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - databricks-sdk>=0.65.0
      # Writes <gold_schema>.finops_gold (estate payloads) + .finops_gold_table_
      # sizes (per-table size census). The job SP needs read on the system tables
      # the app reads + CREATE/MODIFY on the gold schema. Read-only otherwise.

    finops_admin_sync:
      name: ${var.app_name}-admin-sync
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"   # 02:00 daily
        timezone_id: "UTC"
        pause_status: PAUSED                     # unpause once schema + admin grants are set
      tasks:
        - task_key: admin_sync
          spark_python_task:
            # No positional args — the script reads the SAME app.yaml the app
            # uses (synced alongside it), so warehouse / schema config is shared
            # automatically and there's nothing to keep in sync here.
            python_file: ${workspace.root_path}/files/data/admin_sync.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - databricks-sdk>=0.65.0
      # Pulls admin-API data (budgets, policies, tokens, SCIM groups, workspace
      # assignments, DQM monitors) into a Delta <ingest_schema>.finops_admin table.
      # The job's service principal needs ACCOUNT admin (budgets, budget policies,
      # SCIM groups, workspace assignments) + WORKSPACE admin (token management,
      # alerts, quality monitors) — heavier than the app's read-only access.

# ---------------------------------------------------------------------------
# Targets — pick with `-t <target>`.
#   dev            : your own workspace, development mode (local default).
#   customer       : THE recommended customer deploy. Creates a small managed
#                    Lakebase (Postgres) instance, bound to the app, for the
#                    acknowledge/dismiss writeback state — snappy at any scale and
#                    fully self-provisioned (no CLI, no env var, no manual role).
#                    Adds one small always-on instance (~tens of $/mo).
#   customer-delta : the FALLBACK for "don't use Lakebase". Same app, but writeback
#                    state lives in a tiny Delta table via the read warehouse —
#                    ZERO extra infrastructure, zero extra cost. Use this if the
#                    customer doesn't want a managed-Postgres instance.
#
# WHY TWO TARGETS (not a boolean flag): a Databricks Asset Bundle cannot
# conditionally include/omit a *resource* from a variable — creating vs not
# creating the Lakebase instance is therefore expressed as two targets. Writeback
# itself is always on (cheap, valuable, independent of AI/Genie); the only choice
# here is the STORAGE BACKEND — Lakebase (recommended, `customer`) vs Delta
# (fallback, `customer-delta`). store.py auto-selects Lakebase whenever the bound
# instance is present, else Delta, so the app code is identical on both.
# ---------------------------------------------------------------------------
targets:
  dev:
    default: true
    mode: development

  # RECOMMENDED customer deploy — Lakebase-backed writeback.
  # PORTABLE: no host is hardcoded, so this deploys into WHATEVER workspace your
  # CLI profile points at — `databricks auth login --profile <name>` then
  # `databricks bundle deploy -t customer -p <name>`. Binding the Lakebase
  # instance to the app auto-provisions the app SP's Postgres role and injects
  # PGHOST/PGUSER/… at runtime, so store.py uses the Lakebase backend.
  customer:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: estate-command-center
    resources:
      database_instances:
        finops_state:
          name: finops-command-center-state
          capacity: CU_1                 # smallest tier — ample for ack writeback
      apps:
        estate:
          resources:
            - name: database
              database:
                instance_name: ${resources.database_instances.finops_state.name}
                database_name: databricks_postgres
                permission: CAN_CONNECT_AND_CREATE

  # FALLBACK — "don't use Lakebase". No Postgres instance; writeback (still on)
  # uses the Delta backend: a tiny managed Delta table written through the same
  # read warehouse. Nothing extra to provision, no Postgres cost. In live mode
  # this needs a writeback schema (FINOPS_GOLD_SCHEMA or FINOPS_WRITEBACK_SCHEMA)
  # + the app SP granted CREATE on its catalog — see the customer deployment guide.
  customer-delta:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: estate-command-center
