  - id: BEH-001
    category: behavioural
    title: "Stand up a governed Genie Space for a team drowning in ad-hoc inefficient queries"
    trigger: "team_inefficient_query_count > 100 AND team_query_cost_usd_month > 1000 AND distinct_query_authors_in_team <= 10"
    what_to_do:
      - "Identify the top 3-5 users generating the inefficient-query volume and the tables/questions they keep re-asking."
      - "Create a governed AI/BI Genie Space over the curated Gold tables those questions hit, with certified metrics and example queries so business users self-serve in natural language against UC-governed data (read-only, access-scoped, audited)."
      - "Point the team at the Genie Space instead of hand-writing SQL on all-purpose compute; retire the ad-hoc notebooks."
      - "Set a Genie query-execution timeout (Genie auto-cancels executions >15 min) and back it with a serverless SQL warehouse with aggressive auto-stop."
    features:
      - name: "AI/BI Genie (natural language querying)"
        in_geo_status: GA
      - name: "AI/BI Dashboards (formerly Lakeview)"
        in_geo_status: GA
      - name: "Serverless SQL Compute (serverless SQL warehouses)"
        in_geo_status: GA
    expected_impact: "Qualitative + heuristic. Deflects repeated analyst-authored inefficient queries to a governed, cached, right-sized path; savings ≈ team_inefficient_query_count × avg_query_cost × deflection_rate (assume 40-60% deflection, heuristic). Genie enforces UC access policies, is read-only, and logs every interaction for audit."
    effort: Med
    priority_default: P2
    scope: team
    suggested_owner: "Data platform lead + BU analytics lead"
    source: "https://www.databricks.com/blog/how-databricks-genie-democratizes-data-access-financial-services ; https://docs.databricks.com/aws/en/genie/set-up"
    notes: "This is the flagship behavioural play from SPEC §3.7.1. Genie LLM spend is separately governable via BEH-004 / AI-001. Genie budgets (LLM) are separate from the SQL-warehouse compute that runs the query."

