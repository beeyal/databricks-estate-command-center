      - "Set a workspace/warehouse STATEMENT_TIMEOUT so runaway queries are auto-cancelled instead of burning compute."
      - "Restrict cluster-create entitlement so users must launch through the policy (no unbounded custom clusters)."
      - "Move scheduled/repeatable work off all-purpose compute onto jobs compute (see CMP-001)."
    features:
      - name: "Compute policies (cluster policies)"
        in_geo_status: GA
      - name: "Photon (vectorized query engine)"
        in_geo_status: GA
    expected_impact: "Cluster policies enforce autoscaling, auto-termination and instance restrictions — the doc-recommended controls to cap runaway interactive spend. Savings = idle_hours_avoided × node_cost + capped_oversize_delta (heuristic)."
    effort: Low
    priority_default: P1
