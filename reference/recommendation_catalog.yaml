  - id: CMP-001
    category: compute
    title: "Evaluate classic/all-purpose Jobs for serverless (A/B, no savings claim)"
    trigger: "workspace_jobs_on_classic_cost_usd_month > 2000 AND workspace_short_duration_job_share > 0.3"
    savings_estimatable: false
    what_to_do:
      - "List jobs on classic job clusters or (worse) all-purpose compute with short/bursty durations — the profile most likely to benefit from serverless removing spin-up + idle-cluster billing."
      - "A/B test before deciding: run representative jobs on both classic and serverless and compare BILLED cost. Do not assume a saving — serverless jobs DBUs list ~2x classic, and net spend rises for many workloads."
      - "For batch, use Standard (cost-optimized) performance mode (accepts a 4-6 min startup) rather than Performance-optimized; keep Performance-optimized only for latency-critical jobs."
      - "Serverless bills on DBU consumption, not cluster uptime — the win, where it exists, comes from eliminating idle/spin-up time, not a lower unit rate."
      - "Check blockers first: RDD/SparkContext, Scala/JAR, R, init scripts, custom data sources, time-based streaming triggers, and >7-day runs keep a job on classic."
    features:
      - name: "Serverless Jobs & Notebooks (serverless compute for workflows/notebooks)"
        in_geo_status: GA
      - name: 'Serverless pipelines "Standard" cost-optimized mode'
        in_geo_status: GA
    expected_impact: "Serverless can cut cost for short/spiky/idle-heavy classic jobs by removing spin-up and idle-cluster billing, and reduces operational overhead (no cluster config, versionless, fewer failed runs). But serverless jobs DBUs list ~2x classic, so net savings are NOT guaranteed and cannot be estimated without an A/B run of the specific workload. The published '~70%' figure is Standard vs Performance-optimized mode, NOT vs classic. No dollar figure is shown for this play."
    effort: Med
    priority_default: P1
    scope: workspace
    suggested_owner: "Data engineering lead"
    source: "https://docs.databricks.com/aws/en/compute/serverless/migration ; https://learn.microsoft.com/en-us/azure/databricks/compute/serverless/best-practices ; internal: go/serverless-migration-planner (not for customer-facing use)"
    notes: "Serverless Jobs GA in australiaeast. Standard-mode caveats: 4-6 min startup, unsupported for continuous pipelines, runs/submit one-time runs, and SQL-warehouse job tasks. Savings deliberately not estimated (field + docs research 2026-07-20): majority of classic->serverless migrations increase net spend."

