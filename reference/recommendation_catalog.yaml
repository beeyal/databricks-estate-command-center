# =============================================================================
# Estate Command Center — Cost-Optimization Recommendation Catalog
# =============================================================================
# Grounded, platform-operator recommendation catalog powering the §3.7
# Recommendations hub. Each recommendation matches a concrete DATA TRIGGER
# (per-workspace / per-BU / per-team / per-user metric conditions) against a
# real Databricks cost-control play. The catalog-driven strategic-play
# generator evaluates `trigger` against the estate metrics and emits the
# scored, filterable rec list on /api/recommendations/hub.
#
# NOTE: region/in-geo gating was REMOVED from the app. Any `in_geo_status`
# fields remaining below are vestigial metadata — the recommender (data/
# rec_hub.py) reads only `name` from each feature and does not gate on region.
#
# GROUNDING PROVENANCE:
#   - Public Databricks docs + blogs (docs.databricks.com /
#     learn.microsoft.com/azure/databricks / databricks.com/blog) — cited per rec.
#   - Internal FinOps playbook: Glean (go/finops) auth FAILED this session
#     (403 Invalid Token) so it could NOT be used. DBRA (Databricks Research
#     Agent) WAS reachable and corroborated the internal FinOps notebook
#     patterns used here (idle-workload waste detection, workspace sprawl
#     consolidation, per-SKU spending-efficiency classification, node-type
#     right-sizing, billing-anomaly detection) via the PepsiCo cost-optimization
#     playbook + inspire_gen N01-billing / N04-optimization notebooks. DBRA
#     surfaced no shareable dollar figures, so all quantitative impacts below
#     are cited to PUBLIC docs/blogs or explicitly marked `heuristic`.
#
# All dollar savings are ESTIMATES. Ratios/percentages that come from a
# Databricks source carry a cite; formula-derived ones are marked heuristic.
# =============================================================================

