        in_geo_status: PuPr
      - name: "Predictive Optimization"
        in_geo_status: GA
      - name: "Compute policies (cluster policies)"
        in_geo_status: GA
    expected_impact: "Qualitative + risk-avoidance. Aggregates the Governance-page gaps into one posture-improvement play; each sub-control has its own $ story (see referenced recs)."
    effort: Med
    priority_default: P2
    scope: global
    suggested_owner: "FinOps / platform admin"
    source: "https://learn.microsoft.com/en-us/azure/databricks/admin/usage/ ; https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices"
