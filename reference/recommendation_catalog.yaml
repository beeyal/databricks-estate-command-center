    category: tagging
    title: "Close the untagged-spend gap with a BU/Project/Env tag taxonomy"
    trigger: "workspace_untagged_spend_pct > 0.2 AND workspace_spend_usd_month > 5000"
    what_to_do:
      - "Define a mandatory tag taxonomy: BusinessUnit, Project, Environment (dev/test/prod), Owner."
      - "Apply tags to clusters/warehouses/jobs and enforce via cluster policies (policy-set custom tags)."
      - "Report tag coverage % from system.billing.usage; drive untagged spend toward 0 with monthly audits."
    features:
      - name: "Custom tags + Compute policies (tag enforcement)"
        in_geo_status: GA
      - name: "system.billing.usage (billable usage)"
        in_geo_status: GA
    expected_impact: "Qualitative — enables chargeback/showback and pinpoints the real cost drivers so every other rec can be attributed and prioritised. Doc-recommended monitoring practice. No direct $ but unlocks targeted savings."
    effort: Med
    priority_default: P1
    scope: global
    suggested_owner: "FinOps / platform admin"
    source: "https://docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices ; https://learn.microsoft.com/en-us/azure/databricks/admin/system-tables/"
    notes: "P1 because attribution is the foundation for prioritising all other recs. Classic compute tagging only covers non-serverless — pair with TAG-002 for serverless."

  - id: TAG-002
    category: tagging
    title: "Attribute serverless spend with budget policies (serverless usage policies)"
    trigger: "workspace_serverless_spend_usd_month > 2000 AND workspace_serverless_budget_policy_coverage < 0.5"
    what_to_do:
      - "Create serverless usage (budget) policies containing BU/Project/Env tags and assign to users, groups, and service principals."
      - "Tags auto-apply to serverless notebooks, jobs, pipelines, serving endpoints and apps, and land in billing records for chargeback."
      - "Auto-assign a single policy per user; require selection where a user has multiple."
    features:
      - name: "Serverless usage / budget policies (serverless cost-attribution tagging)"
        in_geo_status: PuPr
    expected_impact: "Qualitative — extends cost attribution/chargeback to serverless compute (which classic tags miss). Doc-recommended for serverless cost reporting. Unlocks targeted serverless savings."
    effort: Low
    priority_default: P1
    scope: global
    suggested_owner: "FinOps / workspace admin"
    source: "https://docs.databricks.com/aws/en/admin/usage/budget-policies ; https://www.databricks.com/blog/attribute-serverless-costs-departments-and-users-budget-policies"
    notes: "PuPr in australiaeast (account-level, not region-gated) — surface with a Public Preview badge; still actionable."

  - id: TAG-003
    category: tagging
    title: "Create Account Budgets with threshold email alerts per BU/project/workspace"
    trigger: "account_has_no_budget = true OR bu_spend_usd_month > 10000 AND bu_has_no_budget_alert = true"
    what_to_do:
      - "In Account Console > Usage > Budgets, create budgets filtered by team/project/workspace (or account-wide)."
      - "Set up to 4 monthly-threshold alerts (dollar amount + comma-separated email list) so owners are notified before overrun."
      - "Wire budget breaches into the FinOps review cadence."
    features:
      - name: "Account-level Budgets (Account Console Usage > Budgets, threshold email alerts)"
        in_geo_status: GA
    expected_impact: "Qualitative + risk-avoidance. Prevents silent overruns; up to 4 thresholds with email alerts. risk_multiplier > 1 (no alerts = uncontrolled overrun risk)."
    effort: Low
    priority_default: P1
    scope: global
    suggested_owner: "FinOps lead"
    source: "https://docs.databricks.com/aws/en/admin/account-settings/budgets ; https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/budgets"
    notes: "Now GA in australiaeast (preview banner removed on 2026-07-06 doc rev per in_geo_matrix). Control-plane, not region-gated."

