  # ===========================================================================
  # CATEGORY: tagging & cost attribution — spike detection (SPEC §9.3)
  # ===========================================================================
  - id: TAG-004
    category: tagging
    title: "Investigate + attribute a cost-driver that spiked month-on-month"
    trigger: "driver_cost_mom_change_pct > 0.25 AND driver_cost_usd_month > 1500"
    what_to_do:
      - "Break the spiking billing_origin_product driver down to sku_name and workspace in system.billing.usage to localise the increase."
      - "Confirm whether the jump is a legitimate workload change (new pipeline, backfill, launch) or waste (runaway interactive, missing auto-stop, an unbounded job)."
      - "Attribute the delta to a BU / project via tags; if it is untagged, this is also a TAG-001 gap."
      - "Wire a SQL alert / Account Budget threshold on the driver so the next spike is caught proactively, not in arrears."
    features:
      - name: "system.billing.usage (billable usage)"
        in_geo_status: GA
      - name: "Account-level Budgets (threshold email alerts)"
        in_geo_status: GA
    expected_impact: "Risk-avoidance + attribution. A material MoM driver jump is the earliest signal of waste or an unbudgeted workload; catching it early avoids a full-month overrun. risk_multiplier > 1 (uninvestigated spikes compound)."
    effort: Low
    priority_default: P1
    scope: global
    suggested_owner: "FinOps lead"
    source: "https://learn.microsoft.com/en-us/azure/databricks/admin/system-tables/billing ; https://docs.databricks.com/aws/en/admin/account-settings/budgets"
    notes: "Fires from the per-driver MoM %-change (spike detection) view on Overview/Workspaces. Feeds the Recommendations hub cost-spike trigger."

