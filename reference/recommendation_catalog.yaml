  # CATEGORY: ai / genai spend
  # ===========================================================================
  - id: AI-001
    category: genai
    title: "Cap GenAI spend with Unity AI Gateway budgets + rate limits"
    trigger: "genai_endpoint_spend_usd_month > 1000 AND (endpoint_has_no_rate_limit = true OR account_has_no_ai_budget = true)"
    what_to_do:
      - "Enable Unity AI Gateway usage tracking on serving endpoints to attribute token spend by user/group/SP (usage-tracking table is GA)."
      - "Set rate limits (QPM / TPM) per endpoint and per user/group/SP to cap runaway traffic (rate limiting is GA)."
      - "Where the new Unity AI Gateway spend/budget hard-caps are available, set budgets that STOP requests at threshold (not just alert) — but flag as preview in AU."
      - "For Genie LLM spend specifically, set Genie budgets (tracked via Unity AI Gateway) by account/workspace/group/user."
    features:
      - name: "Unity AI Gateway usage tracking + rate limits (on serving endpoints)"
        in_geo_status: GA
      - name: "Unity AI Gateway budgets / spend controls (unified per-user/team caps)"
        in_geo_status: PrPr
        gated: true
    expected_impact: "Rate limits + usage tracking (GA) attribute and cap GenAI traffic; hard budget caps (preview) stop spend at threshold rather than alerting after the fact (Databricks). Risk-avoidance play — risk_multiplier > 1 for runaway token spend."
    effort: Med
    priority_default: P1
    scope: global
    suggested_owner: "AI platform lead / FinOps"
    source: "https://learn.microsoft.com/en-us/azure/databricks/ai-gateway/ ; https://www.databricks.com/product/artificial-intelligence/unity-ai-gateway ; https://docs.databricks.com/aws/en/genie/budgets"
    notes: "SPLIT STATUS: rate limits + usage tracking are GA in AU (actionable now); the newer unified spend/budget hard-caps are PrPr → gated:true, informational-only until GA. Genie budgets track LLM spend only; the SQL warehouse compute is billed + governed separately."

  - id: AI-002
    category: genai
    title: "Control Foundation Model API cost + guarantee AU data residency for in-app LLM narration"
    trigger: "fmapi_token_spend_usd_month > 500 OR app_llm_model NOT IN (in_region_models)"
    what_to_do:
      - "Pin any in-app / agent LLM narration to an in-region Claude model (databricks-claude-sonnet-4-6 / -sonnet-4-5 / -haiku-4-5) so data stays in the Australia Geo."
      - "Never default to a cross-geo model (sonnet-5, fable-5, opus-4-5, opus-4-1) — those route data out of AU."
      - "Verify the 'Enforce data processing within workspace Geography' toggle AND pin a non-cross-geo model to hard-guarantee residency (cross-geo is ON by default for non-US/EU geos)."
      - "Prefer the cheaper haiku model for high-volume narration; reserve larger models for low-volume/high-value calls."
    features:
      - name: "Foundation Model APIs — Claude (Anthropic) pay-per-token, in-region"
        in_geo_status: GA
    expected_impact: "Qualitative + compliance. Model selection is both a cost lever (haiku << opus per token) and a residency control. risk_multiplier > 1 (cross-geo processing = residency non-compliance risk for AU customers)."
    effort: Low
    priority_default: P2
    scope: global
    suggested_owner: "AI platform lead"
    source: "https://learn.microsoft.com/en-us/azure/databricks/machine-learning/model-serving/foundation-model-overview ; https://learn.microsoft.com/en-us/azure/databricks/resources/databricks-geos#cross-geo-processing"
    notes: "In-region Claude models GA in australiaeast (native, no data egress). This governs the app's OWN LLM narration path per recommender_policy in in_geo_matrix."

  # ===========================================================================
  # CATEGORY: access / governance
