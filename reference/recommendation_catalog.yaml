  - id: GOV-001
    category: access
    title: "Remediate over-privileged prod access — move to least-privilege via groups"
    trigger: "principal_has_MODIFY_or_ALL_on_prod = true AND (grant_is_direct_to_user = true OR principal_is_not_owner = true)"
    what_to_do:
      - "List principals with MODIFY / ALL PRIVILEGES on prod catalogs/schemas from system.information_schema.*_privileges."
      - "Replace direct-to-user grants with group-based grants; scope groups to least privilege (USE/SELECT where write isn't needed)."
      - "Remove broad account users / PUBLIC grants on prod securables; reduce admin sprawl."
    features:
      - name: "system.information_schema (privilege resolution)"
        in_geo_status: GA
      - name: "Automatic Identity Management (AIM) for Microsoft Entra ID"
        in_geo_status: GA
    expected_impact: "Qualitative + risk-avoidance. No direct $ but high governance/security risk if unaddressed (risk_multiplier > 1). Group-based least-privilege is the SPEC §3.1 risk-flag remediation."
    effort: Med
    priority_default: P1
    scope: global
    suggested_owner: "Security / UC admin"
    source: "https://learn.microsoft.com/en-us/azure/databricks/admin/system-tables/ ; https://learn.microsoft.com/en-us/azure/databricks/admin/users-groups/automatic-identity-management/"
    notes: "AIM (Entra ID) GA in australiaeast (Azure-only) — sync Entra groups so group-based grants stay accurate. Access page itself carries NO AI recs (SPEC §3.1); this rec lives in the hub."

  - id: GOV-002
    category: access
    title: "Inventory + rotate stale / aged PATs and tokens"
    trigger: "pat_age_days > 90 OR pat_last_used_days_ago > 60 OR workspace_pat_count > threshold"
    what_to_do:
      - "Inventory PATs/tokens with age + last-use (from audit)."
      - "Revoke stale/unused tokens; rotate aged ones; prefer OAuth / service principals + short-lived tokens."
      - "Set a token max-lifetime workspace policy."
    features:
      - name: "system.access.audit (audit logs)"
        in_geo_status: PuPr
    expected_impact: "Qualitative + risk-avoidance. Aged/unused tokens are a security exposure; no direct $ (risk_multiplier > 1)."
    effort: Low
    priority_default: P2
    scope: workspace
    suggested_owner: "Security / workspace admin"
    source: "https://learn.microsoft.com/en-us/azure/databricks/admin/system-tables/"
    notes: "system.access.audit is PuPr in AU — usable, badge as Public Preview."

  - id: GOV-004
    category: access
    title: "Enforce cost-governance controls where budgets, PO, or tag coverage are missing"
    trigger: "workspace_budget_policy_coverage < 0.5 OR workspace_po_adoption < 0.5 OR workspace_cluster_policy_coverage < 0.5 OR account_has_no_budget = true"
    what_to_do:
      - "Roll out the governance controls the Governance page scores as Warning/Critical: budget policies (TAG-002), account budgets (TAG-003), PO enablement (STO-001), cluster-policy coverage (BEH-002/TAG-001)."
      - "Set each control's target (e.g. tag coverage > 90%, PO adoption > 80%, budget alerts on every BU) and track to Good."
