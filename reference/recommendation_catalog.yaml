# -----------------------------------------------------------------------------
# Priority model — how P1/P2/P3 are assigned
# -----------------------------------------------------------------------------
priority_model:
  summary: >-
    Priority ranks a recommendation by expected value net of cost-to-adopt and
    risk. score = normalise( est_savings_usd_month × frequency_or_severity )
    ÷ effort_weight × risk_multiplier. Recs are sorted by priority tier first,
    then by est_savings_usd_month descending. This mirrors SPEC §3.7:
    "P1 = high $ impact × low effort × (or high risk)".
  formula: "priority_score = (norm_savings * severity) / effort_weight * risk_multiplier"
  inputs:
    savings: "est $/mo the rec unlocks (or avoids), normalised 0..1 across the estate"
    severity: "how acute the trigger is — e.g. queued-query pileup, budget breach, prod over-privilege (1.0..2.0)"
    frequency: "how often the wasteful pattern recurs (run count, daily idle hours)"
    effort_weight: "Low=1, Med=2, High=3 (implementation + change-management cost)"
    risk_multiplier: "1.0 default; >1 when NOT acting carries compliance/security/overrun risk (e.g. region non-compliance, no budget alerts, over-privileged prod, runaway GenAI spend)"
  tiers:
    P1: "High savings AND (Low/Med effort) — OR any unmitigated compliance/security/overrun risk regardless of savings. Do first."
    P2: "Material savings at Med effort, or high savings at High effort. Schedule this quarter."
    P3: "Lower absolute savings, hygiene/enablement, or High effort with modest payback. Backlog / opportunistic."
  gating_note: >-
    A rec whose primary feature is `gated: true` (PrPr/NOT_IN_REGION in AU) is
    never auto-promoted to an actionable P1/P2 apply-CTA; it is shown as
    informational with a "not yet in AU region" flag. Its priority_default is
    retained for when the feature reaches GA/PuPr in australiaeast.

